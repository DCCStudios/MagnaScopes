[Diagnostics]
; Safety rollout gate used during in-game verification.
; 0 = profile detection only
; 1 = verified lens/reticle projection
; 2 = projection plus zoom/camera override lifecycle
; 3 = framework Present source capture, no draw
; 4 = private render hooks, with geometry probe or full composite selected below
; 5 = OG auxiliary-renderer runtime address/page/prologue preflight only;
;     AuxiliaryPassThroughHooks may add the complete forwarding-only hook set
; Production uses the verified Stage 4 late ScopeFade replay. The retired
; Stage 5 auxiliary-world renderer remains disabled by all sub-gates below.
VerificationStage=4
; Stage 5b sub-gate. Installs all four required auxiliary renderer detours as
; one transaction, but every detour only forwards to the original function.
; No second render, scope effect, profile update, or override is enabled.
AuxiliaryPassThroughHooks=0
; Stage 5c-a sub-gate. Installs the same forwarding-only detours with bounded
; invocation and worker-lifetime telemetry. It does not request an auxiliary
; render or enable resources, visuals, profiles, overrides, UI, or Papyrus.
; Keep this mutually exclusive with AuxiliaryPassThroughHooks.
AuxiliaryObservationHooks=0
; Stage 5c functional gate. Produces the private world-only source and feeds
; it through the exact STS ScopeFade geometry. This is mutually exclusive with
; the two diagnostic hook gates above.
AuxiliaryWorldPass=0
; Stage 2 sub-gate. Keep at 0 for the FOV-only test, then set to 1 for
; the camera-offset lifecycle test. Stage 4 enables camera overrides.
CameraOverride=0
; Stage 3 sub-gate. Set to 1 only after framework Present capture passes.
; This adds the guarded OG TAA callback but still performs no scope draw.
TAACapture=1
; Stage 4a visual destination probe. At Stage 3, set this to 1 to draw
; a translucent cyan disc at the projected automatic STS aperture.
; No MagnaScope shader, render-target bind, or magnification is used.
VisualProbe=0
; Stage 4d depth-contract probe. At Stage 4, set this to 1 to recolor the
; authored ScopeFade annulus and fill its center with solid cyan. The geometry
; shader runs on ScopeFade's exact draw, so the game keeps its transform,
; visibility, draw order, and depth state. While this is 1, the fullscreen
; composite remains disabled.
GeometryProbe=1
; Stage 4e.2 ScopeFade magnification. This requires GeometryProbe=1. It uses
; the selected profile or live editor magnification and draws through the
; authored ScopeFade geometry. This is the production magnification path.
GeometryMagnification=1

[AutoSTS]
; Set to 0 to require explicit FTS profiles.
Enabled=1

; Diameter in reference pixels at 1080p. The shader scales this with height.
DefaultMaskDiameter=700.0

; Starting magnification inside automatically detected STS scopes.
DefaultMagnification=1.0

; Mouse wheel zoom range multiplier for generated profiles.
ZoomSpread=1.5
